:root{
  --bg-dark:#191613;
  --sheet:#F1F0EE;
  --ink:#141414;
  --ink-soft:#3a3a3a;
  --grey:#8a8a86;
  --grey-light:#b9b8b4;
  --line:#d9d8d4;
  --card-r:16px;
  --pill-r:100px;
  --ease:cubic-bezier(.22,1,.36,1);
  --sans:'PP Neue Montreal',-apple-system,'Helvetica Neue',Arial,sans-serif;
  --mono:'PP Neue Montreal Mono','SF Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg-dark);font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:100%;object-fit:cover}
ul{list-style:none}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}

.sheet{max-width:1480px;margin:0 auto;background:var(--sheet);padding:0 clamp(20px,3.5vw,52px);min-height:100vh;position:relative}
@media(min-width:1540px){.sheet{margin:28px auto}}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:60;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;
  margin:0 calc(-1*clamp(20px,3.5vw,52px));padding:28px clamp(20px,3.5vw,52px);
  transition:background-color .4s var(--ease)}
.hdr.small{background-color:rgba(241,240,238,.92)}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .hdr.small{background-color:rgba(241,240,238,.68);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6)}
}
.hdr-id-txt{overflow:hidden;white-space:nowrap;transition:opacity .3s var(--ease),max-width .45s var(--ease),margin-left .45s var(--ease);max-width:340px}
.hdr.small .hdr-id-txt{opacity:0;max-width:0;margin-left:-22px;pointer-events:none}
.hdr-id{display:flex;align-items:center;gap:22px}
.logo-mark{height:26px;width:auto;flex-shrink:0;color:var(--ink);overflow:visible}
.logo-mark .ln{transform-origin:43.49px 58px;transform:rotate(var(--a)) scaleY(1);animation:logoIdle 10s cubic-bezier(.65,0,.35,1) infinite}
.logo-mark .l2{animation-delay:.25s}
.logo-mark .l3{animation-delay:.5s}
@keyframes logoIdle{
  0%{transform:rotate(var(--a)) scaleY(1)}
  10%{transform:rotate(var(--a)) scaleY(-1)}
  100%{transform:rotate(var(--a)) scaleY(-1)}
}
@keyframes logoOnce{
  from{transform:rotate(var(--a)) scaleY(1)}
  to{transform:rotate(var(--a)) scaleY(-1)}
}

/* ================= RENDER HELPERS ================= */
function media(src, label){
  return `<div class="media" data-src="${src}"><span class="ph-label">${label||src}</span></div>`;
}
function initMedia(scope){
  (scope||document).querySelectorAll('.media[data-src]').forEach(m=>{
    if(m.dataset.done) return; m.dataset.done = 1;
    const img = new Image(); img.alt='';
    img.onload = ()=>{ m.prepend(img); };
    img.onerror = ()=>{ m.classList.add('missing'); };
    img.src = m.dataset.src;
  });
}

function renderStatic(){
  document.documentElement.lang = LANG;
  document.getElementById('hdrName').textContent = t(T.name);
  document.querySelectorAll('.nav a, .mmenu-links a').forEach(a=>a.textContent = t(T.nav[a.dataset.nav]));
  document.getElementById('heroNote').textContent = t(T.heroNote);
  document.getElementById('updLbl').textContent = t(T.updLbl);
  document.getElementById('updDate').textContent = t(T.updDate);
  document.getElementById('heroH').innerHTML = t(T.heroH);
  document.getElementById('teaserSideLbl').textContent = t(T.teaserSideLbl);
  document.getElementById('teaserSideList').innerHTML = t(T.about.skills).map(s=>`<li>${s}</li>`).join('');
  document.getElementById('teaserH').innerHTML = t(T.teaserH);
  document.getElementById('teaserP').innerHTML = t(T.about.txt).map(p=>`<p>${p}</p>`).join('');
  document.getElementById('teaserBtn').textContent = t(T.readMore);
  document.getElementById('ftrSideLbl').textContent = t(T.ftrSideLbl);
  document.getElementById('ftrRoles').innerHTML = t(T.ftrRoles).map(s=>`<li>${s}</li>`).join('');
  document.getElementById('ftrH').textContent = t(T.ftrH);
  document.getElementById('ftrCopy').textContent = t(T.ftrCopy);
  document.getElementById('langEn').classList.toggle('on', LANG==='en');
  document.getElementById('langRu').classList.toggle('on', LANG==='ru');
  document.title = LANG==='en' ? 'Zhora Kashpur — brand designer & art director' : 'Жора Кашпур — бренд-дизайнер и арт-директор';
}

function renderGrid(){
  const spanPattern = ['w2','', '', 'w2', 'w3', 'w2', ''];
  const grid = document.getElementById('workGrid');
  grid.innerHTML = PROJECTS.map((p,i)=>`
    <a class="card ${spanPattern[i]||''}" href="#/project/${p.slug}" aria-label="${t(p.title)}">
      <span class="card-img">${p.cardVideo
        ? `<video class="cvid" poster="${asset(p.cardPoster)}" autoplay muted loop playsinline preload="auto"><source src="${asset(p.cardVideo)}" type="video/mp4"><source src="${asset(p.cardVideoWebm)}" type="video/webm"></video>`
        : media(asset(p.cover || p.slug+'-cover.jpg'))}</span>
      <span class="num">${p.year}</span>
      <span class="ttl">${t(p.title)}</span>
      <span class="tgs">${t(p.tags).join(' · ')}</span>
      <span class="card-cap"><span class="cap-ttl">${t(p.title)}</span><span class="cap-scope">${t(p.tags).join(' · ')}</span></span>
    </a>`).join('');
  initMedia(grid);
  grid.querySelectorAll('video.cvid').forEach(v=>{
    const kick=()=>{ const pr=v.play(); if(pr&&pr.catch) pr.catch(()=>{}); };
    kick();
    v.addEventListener('loadeddata',kick,{once:true});
    v.addEventListener('canplay',kick,{once:true});
    document.addEventListener('click',kick,{once:true});
  });
}

function renderAbout(){
  const A = T.about;
  document.getElementById('page-about').innerHTML = `
  <div class="about-photo">${media(asset('about-photo.jpg'))}</div>
  <section class="about-hero">
    <h1>${t(A.h1)}</h1>
  </section>
  <section class="about-cols">
    <div class="about-left">
      <div class="blk"><div class="side-lbl">${t(A.skillsLbl)}</div><ul>${t(A.skills).map(s=>`<li>${s}</li>`).join('')}</ul></div>
    </div>
    <div class="about-right">
      <h2 class="sec-h">${t(A.secH)}</h2>
      <div class="xp">${A.xp.map(x=>`<div class="xp-row"><div class="yrs">${x.yrs}</div><div><div class="co">${typeof x.co==='string'?x.co:t(x.co)}</div><div class="role">${t(x.role)}</div></div></div>`).join('')}</div>
      <div class="txt">${t(A.txt).map(p=>`<p>${p}</p>`).join('')}</div>
    </div>

  initMedia(document.getElementById('page-about'));
  requestAnimationFrame(parallax);

function renderProject(slug){
  const p = PROJECTS.find(x=>x.slug===slug);
  const host = document.getElementById('page-project');
  if(!p){ host.innerHTML = `<section class="pr"><h1 style="padding:80px 0">${t(T.notFound)}</h1></section>`; return; }
  const i = PROJECTS.indexOf(p);
  const next = PROJECTS[(i+1)%PROJECTS.length];
  const row = (k,v)=>`<div class="pr-trow"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  const metaRows = p.meta.map(m=>row(t(T.keys[m[0]]), t(m[1])));
  const rows = (metaRows[0]||'')
    + row(t(T.keys.year), p.year)
    + metaRows.slice(1).join('')
    + row(t(T.keys.scope), t(p.tags).join(' · '))
    + (p.links.length? row(t(T.keys.links), p.links.map(l=>`<a href="${l[1]}" ${l[1]!=='#'?'target="_blank" rel="noopener"':''}>${t(l[0])}</a>`).join(' · ')):'');
  const mediaBlocks = p.media.map(m=>{
    if(m.v!==undefined){
      return m.v
        ? `<div class="m vid"><iframe src="${m.v}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy" title="video"></iframe></div>`
        : `<div class="m vph"><div class="vlabel"><span class="ic">▶</span><span>${t(T.videoSlot)}</span></div></div>`;
    }
    if(m.f){
      return `<div class="m filevid"><video poster="${asset(m.fp)}" autoplay muted loop playsinline preload="metadata"><source src="${asset(m.f)}" type="video/mp4"><source src="${asset(m.fw)}" type="video/webm"></video></div>`;
    }
    const src = asset(m.i);
    return `<div class="m"><img src="${src}" alt="" loading="lazy" onerror="this.parentNode.classList.add('missing')"><span class="ph-label">${src}</span></div>`;
  }).join('');
  host.innerHTML = `
  <article class="pr">
    <div class="pr-cover${p.coverVideo?' vid':''}${p.coverFile?' filevid':''}">${
      p.coverFile
        ? `<video class="cfile" poster="${asset(p.coverFilePoster)}" autoplay muted loop playsinline preload="auto"><source src="${asset(p.coverFile)}" type="video/mp4"><source src="${asset(p.coverFileWebm)}" type="video/webm"></video>`
      : p.coverVideo
        ? `<iframe src="${p.coverVideo}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy" title="cover video"></iframe>`
        : media(asset(p.cover || p.slug+'-cover.jpg'))}</div>
    <div class="pr-body">
      <h1>${t(p.title)}</h1>
      <div>
        <div class="pr-table">${rows}</div>
        <div class="pr-desc">${t(p.desc).map(d=>`<p>${d}</p>`).join('')}</div>
      </div>
    </div>
    <section class="pr-media">${mediaBlocks}</section>
    <div class="pr-nav">
      <a class="btn ghost" href="#/">${t(T.allProjects)}</a>
      <a class="btn solid" href="#/project/${next.slug}">${t(T.next)} ${t(next.title)}</a>
    </div>
  </article>`;
  initMedia(host);
  host.querySelectorAll('video').forEach(v=>{
    const kick=()=>{ const pr=v.play(); if(pr&&pr.catch) pr.catch(()=>{}); };
    kick(); v.addEventListener('canplay',kick,{once:true}); document.addEventListener('click',kick,{once:true});
  });
}

/* ================= ROUTER =================
   Navigation is driven by JS state (PATH), not by anchor default behavior,
   so it works even in sandboxed previews that block link navigation.
   location.hash is kept in sync when the environment allows it. */
const pages = {home:document.getElementById('page-home'),about:document.getElementById('page-about'),project:document.getElementById('page-project')};
let currentSlug = null;
let PATH = '#/';

function navigate(path){
  PATH = path || '#/';
  let name='home', navKey='home';
  if(PATH.startsWith('#/project/')){ name='project'; navKey='projects'; currentSlug=PATH.split('/')[2]; renderProject(currentSlug); }
  else if(PATH==='#/about'){ name='about'; navKey='about'; currentSlug=null; renderAbout(); }
  else { currentSlug=null; }
  Object.values(pages).forEach(p=>p.classList.remove('on'));
  pages[name].classList.add('on');
  highlight(navKey);
  window.scrollTo({top:0});
  requestAnimationFrame(alignCols);
}
function go(path){
  try{ if(location.hash !== path) location.hash = path; }catch(err){}
  navigate(path);
}
function highlight(key){
  document.querySelectorAll('.nav a, .mmenu-links a').forEach(a=>a.classList.toggle('on', a.dataset.nav===key));
}
function rerender(){
  renderStatic(); renderGrid(); requestAnimationFrame(alignHero);
  if(PATH.startsWith('#/project/')) renderProject(currentSlug);
  else if(PATH==='#/about') renderAbout();
}
document.getElementById('langEn').addEventListener('click',()=>{ if(LANG!=='en'){LANG='en';rerender();} });
document.getElementById('langRu').addEventListener('click',()=>{ if(LANG!=='ru'){LANG='ru';rerender();} });
function scrollGrid(){ document.getElementById('workGrid').scrollIntoView({behavior:'smooth'}); highlight('projects'); }

/* delegated click handling for ALL internal links (cards, nav, buttons) */
function closeMenu(){ document.getElementById('mmenu').classList.remove('open'); }
document.addEventListener('click', e=>{
  const a = e.target.closest('a[href^="#"]');
  if(!a) return;
  e.preventDefault();
  closeMenu();
  const href = a.getAttribute('href');
  if(a.classList.contains('hdr-id')){
    if(PATH!=='#/') go('#/');
    window.scrollTo({top:0,behavior:'smooth'});
    return;
  }
  if(a.dataset.nav==='projects'){
    if(PATH!=='#/'){ go('#/'); setTimeout(scrollGrid,120); } else scrollGrid();
    return;
  }
  if(href==='#contacts' || a.dataset.nav==='contacts'){
    if(PATH!=='#/' && PATH!=='#contacts'){ /* contacts footer exists on every page */ }
    document.getElementById('contacts').scrollIntoView({behavior:'smooth'});
    highlight('contacts');
    return;
  }
  go(href);
});
document.getElementById('burger').addEventListener('click', ()=>document.getElementById('mmenu').classList.add('open'));
document.getElementById('mclose').addEventListener('click', closeMenu);

/* browser back/forward still works where hash is available */
window.addEventListener('hashchange', ()=>{
  const h = location.hash || '#/';
  if(h !== PATH && h !== '#contacts') navigate(h);
});

/* align key columns to the nav pill's left edge: hero H1, project table, footer rows */
function alignCols(){
  const nav = document.querySelector('.nav');
  const navLeft = nav.getBoundingClientRect().left;
  ['.hero','.teaser','.about-cols','.pr-body','.ftr-grid'].forEach(sel=>{
    document.querySelectorAll(sel).forEach(el=>{
      if(window.innerWidth <= 860){ el.style.gridTemplateColumns=''; return; }
      const gap = parseFloat(getComputedStyle(el).columnGap)||32;
      const col = navLeft - el.getBoundingClientRect().left - gap;
      if(col > 180) el.style.gridTemplateColumns = col+'px 1fr';
    });
  });
}
const alignHero = alignCols;
const hdrEl = document.querySelector('.hdr');
function onScroll(){ hdrEl.classList.toggle('small', window.scrollY > 24); }
let paraTick = false;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function parallax(){
  paraTick = false;
  if(reduceMotion) return;
  const img = document.querySelector('.about-photo img');
  if(!img) return;
  const box = img.parentElement.getBoundingClientRect();
  const vh = window.innerHeight || 1;
  const prog = ((box.top + box.height/2) - vh/2) / (vh/2 + box.height/2); // -1 .. 1
  const amp = Math.min(box.height * 0.135, 100);
  img.style.setProperty('--py', (Math.max(-1,Math.min(1,prog)) * -amp).toFixed(1)+'px');
}
function onScrollFx(){ if(!paraTick){ paraTick = true; requestAnimationFrame(parallax); } }
window.addEventListener('scroll', onScrollFx, {passive:true});
window.addEventListener('resize', onScrollFx);
window.addEventListener('scroll', onScroll, {passive:true});
onScroll();

window.addEventListener('resize', alignCols);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(alignCols);

renderStatic(); renderGrid(); navigate(location.hash||'#/'); alignHero();
